<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%" style="background:#fdfcf7; font-family: Arial, sans-serif;">
  <rect width="790" height="1040" x="5" y="5" rx="15" fill="#FAF8F0" stroke="#2E7D32" stroke-width="4"/>
  <rect width="770" height="1020" x="15" y="15" rx="10" fill="#FFFFFF" stroke="#8D6E63" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect width="770" height="120" x="15" y="15" rx="10" fill="#2E7D32"/>
  <circle cx="70" cy="75" r="38" fill="#FFFFFF" opacity="0.95"/>
  <text x="70" y="83" font-size="28" text-anchor="middle" fill="#2E7D32" font-weight="bold">🌱</text>
  <text x="400" y="52" font-size="22" text-anchor="middle" fill="#FFFFFF" font-weight="bold" letter-spacing="1">SOIL HEALTH CARD / ମୃତ୍ତିକା ସ୍ୱାସ୍ଥ୍ୟ କାର୍ଡ</text>
  <text x="400" y="78" font-size="14" text-anchor="middle" fill="#E8F5E9">Department of Agriculture &amp; Farmers' Empowerment, Govt. of Odisha</text>
  <text x="400" y="100" font-size="12" text-anchor="middle" fill="#FFF9C4">Odisha University of Agriculture &amp; Technology (OUAT) | Cuttack</text>

  <!-- Farmer & Sample Meta -->
  <rect width="740" height="95" x="30" y="150" rx="8" fill="#F1F8E9" stroke="#C8E6C9" stroke-width="1.5"/>
  <text x="45" y="178" font-size="14" fill="#1B5E20" font-weight="bold">Farmer Name: <tspan fill="#333" font-weight="normal">Bichitra Sahoo</tspan></text>
  <text x="400" y="178" font-size="14" fill="#1B5E20" font-weight="bold">Card ID: <tspan fill="#333" font-weight="normal">OD-CTC-2026-042</tspan></text>
  <text x="45" y="205" font-size="14" fill="#1B5E20" font-weight="bold">Village / Dist: <tspan fill="#333" font-weight="normal">Athagarh, Cuttack, Odisha</tspan></text>
  <text x="400" y="205" font-size="14" fill="#1B5E20" font-weight="bold">Date of Testing: <tspan fill="#333" font-weight="normal">10-Oct-2026</tspan></text>
  <text x="45" y="232" font-size="14" fill="#1B5E20" font-weight="bold">Plot Size: <tspan fill="#333" font-weight="normal">1.50 Acres</tspan></text>
  <text x="400" y="232" font-size="14" fill="#1B5E20" font-weight="bold">Proposed Crop: <tspan fill="#2E7D32" font-weight="bold">Rice / Paddy (Kharif)</tspan></text>

  <!-- Section Title -->
  <rect width="740" height="34" x="30" y="260" fill="#6D4C41" rx="4"/>
  <text x="45" y="283" font-size="15" fill="#FFFFFF" font-weight="bold">1. CHEMICAL &amp; MACRO-NUTRIENT ANALYSIS</text>

  <!-- Table Header -->
  <rect width="740" height="32" x="30" y="300" fill="#EFEBE9"/>
  <text x="45" y="322" font-size="13" font-weight="bold" fill="#4E342E">Parameter</text>
  <text x="280" y="322" font-size="13" font-weight="bold" fill="#4E342E">Test Result</text>
  <text x="420" y="322" font-size="13" font-weight="bold" fill="#4E342E">Unit</text>
  <text x="540" y="322" font-size="13" font-weight="bold" fill="#4E342E">Rating</text>
  <text x="660" y="322" font-size="13" font-weight="bold" fill="#4E342E">Ideal Range</text>

  <!-- Rows -->
  <!-- pH -->
  <line x1="30" y1="365" x2="770" y2="365" stroke="#E0E0E0"/>
  <text x="45" y="354" font-size="14" fill="#222">pH (Soil Reaction)</text>
  <text x="280" y="354" font-size="15" font-weight="bold" fill="#D32F2F">5.20</text>
  <text x="420" y="354" font-size="13" fill="#666">-</text>
  <rect x="535" y="338" width="90" height="24" rx="4" fill="#FFEBEE"/>
  <text x="580" y="355" font-size="12" font-weight="bold" fill="#C62828" text-anchor="middle">ACIDIC</text>
  <text x="660" y="354" font-size="13" fill="#666">6.5 - 7.5</text>

  <!-- EC -->
  <line x1="30" y1="400" x2="770" y2="400" stroke="#E0E0E0"/>
  <text x="45" y="389" font-size="14" fill="#222">Electrical Conductivity (EC)</text>
  <text x="280" y="389" font-size="15" font-weight="bold" fill="#2E7D32">0.32</text>
  <text x="420" y="389" font-size="13" fill="#666">dS/m</text>
  <rect x="535" y="373" width="90" height="24" rx="4" fill="#E8F5E9"/>
  <text x="580" y="390" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="middle">Normal / Safe</text>
  <text x="660" y="389" font-size="13" fill="#666">&lt; 1.0</text>

  <!-- Organic Carbon -->
  <line x1="30" y1="435" x2="770" y2="435" stroke="#E0E0E0"/>
  <text x="45" y="424" font-size="14" fill="#222">Organic Carbon (OC)</text>
  <text x="280" y="424" font-size="15" font-weight="bold" fill="#D32F2F">0.38</text>
  <text x="420" y="424" font-size="13" fill="#666">%</text>
  <rect x="535" y="408" width="90" height="24" rx="4" fill="#FFEBEE"/>
  <text x="580" y="425" font-size="12" font-weight="bold" fill="#C62828" text-anchor="middle">Low</text>
  <text x="660" y="424" font-size="13" fill="#666">&gt; 0.75 %</text>

  <!-- Nitrogen -->
  <line x1="30" y1="470" x2="770" y2="470" stroke="#E0E0E0"/>
  <text x="45" y="459" font-size="14" fill="#222">Available Nitrogen (N)</text>
  <text x="280" y="459" font-size="15" font-weight="bold" fill="#D32F2F">175.0</text>
  <text x="420" y="459" font-size="13" fill="#666">kg/ha</text>
  <rect x="535" y="443" width="90" height="24" rx="4" fill="#FFEBEE"/>
  <text x="580" y="460" font-size="12" font-weight="bold" fill="#C62828" text-anchor="middle">Low</text>
  <text x="660" y="459" font-size="13" fill="#666">280 - 560</text>

  <!-- Phosphorus -->
  <line x1="30" y1="505" x2="770" y2="505" stroke="#E0E0E0"/>
  <text x="45" y="494" font-size="14" fill="#222">Available Phosphorus (P)</text>
  <text x="280" y="494" font-size="15" font-weight="bold" fill="#D32F2F">8.50</text>
  <text x="420" y="494" font-size="13" fill="#666">kg/ha</text>
  <rect x="535" y="478" width="90" height="24" rx="4" fill="#FFEBEE"/>
  <text x="580" y="495" font-size="12" font-weight="bold" fill="#C62828" text-anchor="middle">Low</text>
  <text x="660" y="494" font-size="13" fill="#666">10 - 25</text>

  <!-- Potassium -->
  <line x1="30" y1="540" x2="770" y2="540" stroke="#E0E0E0"/>
  <text x="45" y="529" font-size="14" fill="#222">Available Potassium (K)</text>
  <text x="280" y="529" font-size="15" font-weight="bold" fill="#D32F2F">95.0</text>
  <text x="420" y="529" font-size="13" fill="#666">kg/ha</text>
  <rect x="535" y="513" width="90" height="24" rx="4" fill="#FFEBEE"/>
  <text x="580" y="530" font-size="12" font-weight="bold" fill="#C62828" text-anchor="middle">Low</text>
  <text x="660" y="529" font-size="13" fill="#666">108 - 280</text>

  <!-- Section 2: Micronutrients -->
  <rect width="740" height="34" x="30" y="565" fill="#6D4C41" rx="4"/>
  <text x="45" y="588" font-size="15" fill="#FFFFFF" font-weight="bold">2. MICRONUTRIENTS ANALYSIS (ppm)</text>

  <rect width="740" height="32" x="30" y="605" fill="#EFEBE9"/>
  <text x="45" y="627" font-size="13" font-weight="bold" fill="#4E342E">Micronutrient</text>
  <text x="280" y="627" font-size="13" font-weight="bold" fill="#4E342E">Value (ppm)</text>
  <text x="420" y="627" font-size="13" font-weight="bold" fill="#4E342E">Critical Limit</text>
  <text x="580" y="627" font-size="13" font-weight="bold" fill="#4E342E">Status</text>

  <!-- Sulphur -->
  <line x1="30" y1="670" x2="770" y2="670" stroke="#E0E0E0"/>
  <text x="45" y="659" font-size="14" fill="#222">Sulphur (S)</text>
  <text x="280" y="659" font-size="14" font-weight="bold" fill="#D32F2F">7.20</text>
  <text x="420" y="659" font-size="13" fill="#666">10.0 ppm</text>
  <text x="580" y="659" font-size="13" font-weight="bold" fill="#D32F2F">DEFICIENT</text>

  <!-- Zinc -->
  <line x1="30" y1="705" x2="770" y2="705" stroke="#E0E0E0"/>
  <text x="45" y="694" font-size="14" fill="#222">Zinc (Zn)</text>
  <text x="280" y="694" font-size="14" font-weight="bold" fill="#D32F2F">0.42</text>
  <text x="420" y="694" font-size="13" fill="#666">0.60 ppm</text>
  <text x="580" y="694" font-size="13" font-weight="bold" fill="#D32F2F">DEFICIENT (Khaira Risk)</text>

  <!-- Iron -->
  <line x1="30" y1="740" x2="770" y2="740" stroke="#E0E0E0"/>
  <text x="45" y="729" font-size="14" fill="#222">Iron (Fe)</text>
  <text x="280" y="729" font-size="14" font-weight="bold" fill="#2E7D32">8.50</text>
  <text x="420" y="729" font-size="13" fill="#666">4.50 ppm</text>
  <text x="580" y="729" font-size="13" font-weight="bold" fill="#2E7D32">Sufficient</text>

  <!-- Key Observation Highlight Box -->
  <rect width="740" height="95" x="30" y="805" rx="8" fill="#FFEBEE" stroke="#EF5350" stroke-width="1.5"/>
  <text x="45" y="833" font-size="14" font-weight="bold" fill="#C62828">SOIL AMENDMENT REQUIRED / ଜରୁରୀ ପରାମର୍ଶ:</text>
  <text x="45" y="858" font-size="13" fill="#333">Soil is strongly acidic (pH 5.2) with critical Zinc deficiency (0.42 ppm).</text>
  <text x="45" y="880" font-size="13" font-weight="bold" fill="#B71C1C">Apply Agricultural Lime (375 kg for 1.5 ac) + 15 kg Zinc Sulphate before transplanting.</text>

  <!-- Footer & Seal -->
  <line x1="30" y1="925" x2="770" y2="925" stroke="#A1887F" stroke-width="1"/>
  <text x="45" y="955" font-size="12" fill="#666">Soil Testing Laboratory, KVK Cuttack, Santhapur, Odisha</text>
  <text x="45" y="975" font-size="11" fill="#999">Government of Odisha | Soil Health Scheme | http://soilhealth.dac.gov.in</text>

  <!-- Lab Stamp -->
  <circle cx="700" cy="960" r="32" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="700" y="956" font-size="10" font-weight="bold" fill="#2E7D32" text-anchor="middle">SOIL TESTING</text>
  <text x="700" y="968" font-size="9" fill="#2E7D32" text-anchor="middle">LABORATORY</text>
  <text x="700" y="979" font-size="8" fill="#2E7D32" text-anchor="middle">VERIFIED</text>
</svg>
